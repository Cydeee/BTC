app = "binance-proxy"
primary_region = "fra"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  image = "node:18-alpine"

[env]
  NODE_ENV = "production"

[[services]]
  http_checks = []
  internal_port = 8080
  protocol = "tcp"
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"
  [[services.ports]]
    handlers = ["http"]
    port = 80
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
