# .github/workflows/update-live.yml
name: refresh-live-json

permissions:
  contents: write

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with: node-version: "18"
      - name: Install (instant, no deps)
        run: npm install
      - name: Fetch & write live.json
        run: npm run generate-live
      - name: Commit & push live.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/live.json
          if git diff --cached --quiet; then
            echo "ℹ️  No changes"
            exit 0
          fi
          git commit -m "chore: refresh live.json"
          git push origin HEAD:main
