name: Deploy Binance Proxy to Fly

on:
  push:
    paths:
      - "fly-proxy/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master  # installs flyctl :contentReference[oaicite:4]{index=4}

      - name: Deploy to Fly.io
        run: flyctl deploy --directory fly-proxy --remote-only
        env:
          FLY_API_TOKEN: >
            FlyV1 fm2_lJPECAAAAAAACYwhxBCaosxGd4RXeMIy27qwjjS5wrVodHRwczovL2FwaS5mbHkuaW8vdjGUAJLOABJaHx8Lk7lodHRwczovL2FwaS5mb...
            # (full token, hard‑coded) :contentReference[oaicite:5]{index=5}
