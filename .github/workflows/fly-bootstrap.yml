# .github/workflows/fly-bootstrap.yml

name: Bootstrap & Deploy Fly Proxy

on:
  workflow_dispatch:

jobs:
  bootstrap-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Hard‑coded org‑scoped Fly token (not using GitHub Secrets)
      FLY_ORG_TOKEN: FlyV1 fm2_,fm2_lJPETvXvkzdba3Lxs+fWODgpBgQWOmT4h8wbOPNLoOWCgEx9FzjT2F6hL4SBeQxIRrmMC94bjLFduDRG0GX14ZlkXkY99PRqnG3tVxvsw7WP4cQQX2sm5vFX4Vq0nMRaaKyLaMO5aHR0cHM6Ly9hcGkuZmx5LmlvL2FhYS92MZgEks5ohYBbzwAAAAEkfZ55F84AEaOYCpHOABGjmAzEELg5DVLKiBw0EdnSWh0Ye9nEIJHKvZ4+cwSnZtaklcVsAgliGow/b9ZCWqIh31/sN1Ly
      APP_NAME: binance-proxy
      REGION: fra
      PROXY_DIR: fly-proxy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Fly App (if not exists)
        run: |
          resp=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://api.fly.io/api/v1/apps \
            -H "Authorization: Bearer $FLY_ORG_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$APP_NAME\"}")
          if [ "$resp" = "409" ]; then
            echo "App $APP_NAME already exists → skipping"
          elif [ "$resp" = "201" ]; then
            echo "Created app $APP_NAME"
          else
            echo "Unexpected status $resp creating app" >&2
            exit 1
          fi

      - name: Generate App‑Scoped Deploy Token
        id: token
        run: |
          out=$(curl -s \
            -X POST https://api.fly.io/api/v1/apps/$APP_NAME/deploy_tokens \
            -H "Authorization: Bearer $FLY_ORG_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"github-deploy","expiry":"720h"}')
          token=$(echo "$out" | jq -r .token)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Failed to create deploy token: $out" >&2
            exit 1
          fi
          echo "::set-output name=DEPLOY_TOKEN::$token"

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy via Flyctl
        env:
          FLY_API_TOKEN: ${{ steps.token.outputs.DEPLOY_TOKEN }}
        run: |
          flyctl deploy \
            --app $APP_NAME \
            --region $REGION \
            --remote-only \
            --directory $PROXY_DIR
